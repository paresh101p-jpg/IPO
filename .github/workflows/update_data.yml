name: Update Live IPO Data

on:
  schedule:
    # Runs every 3 hours (8 times a day)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 gspread oauth2client
        
    - name: Create Credentials File
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > backend/credentials.json

    - name: Run Scraper
      run: python backend/scraper.py
      
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add backend/*.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live IPO, News and Buybacks data" && git push)
